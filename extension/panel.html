<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="xterm.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9" /></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24">
        <line x1="19" y1="12" x2="5" y2="12" />
        <polyline points="12 19 5 12 12 5" />
      </symbol>
      <symbol id="i-github" viewBox="0 0 24 24">
        <path
          d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
        />
      </symbol>
      <symbol id="i-ticket" viewBox="0 0 24 24">
        <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z" />
        <line x1="13" y1="5" x2="13" y2="19" stroke-dasharray="2 3" />
      </symbol>
      <symbol id="i-pin" viewBox="0 0 24 24">
        <path d="M12 17v5" />
        <path d="M9 3h6l-1 7 4 3v2H6v-2l4-3z" />
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <polyline points="23 4 23 10 17 10" />
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
      </symbol>
      <symbol id="i-activity" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24">
        <polyline points="4 17 10 11 4 5" />
        <line x1="12" y1="19" x2="20" y2="19" />
      </symbol>
      <symbol id="i-gear" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
        />
      </symbol>
    </svg>
    <nav id="list">
      <div id="list-header" class="section-header">
        <button type="button" id="collapse" class="icon-btn" title="Collapse list" aria-label="Collapse list">
          <svg class="icon"><use href="#i-chevron-left" /></svg>
        </button>
        <span id="list-title" class="section-title">Workspaces</span>
        <button type="button" id="shell-open" class="icon-btn" title="Terminal" aria-label="Terminal">
          <svg class="icon"><use href="#i-terminal" /></svg>
        </button>
        <button type="button" id="monitor-open" class="icon-btn" title="System monitor" aria-label="System monitor">
          <svg class="icon"><use href="#i-activity" /></svg>
        </button>
        <button type="button" id="settings-open" class="icon-btn" title="Settings" aria-label="Settings">
          <svg class="icon"><use href="#i-gear" /></svg>
        </button>
      </div>
      <input id="list-search" type="search" placeholder="Filter workspaces" aria-label="Filter workspaces" autocomplete="off" hidden />
      <ul id="workspaces"></ul>
      <button type="button" id="new" title="New workspace"><span class="plus">+</span><span class="label">New workspace</span></button>
      <section id="git" class="section">
        <div class="v-resizer" data-resize="git" title="Drag to resize, double-click to reset"></div>
        <div id="git-header" class="section-header">
          <button type="button" id="git-toggle" class="icon-btn section-toggle" title="Collapse source control" aria-label="Collapse source control">
            <svg class="icon"><use href="#i-chevron-down" /></svg>
          </button>
          <span id="git-title" class="section-title">Source control</span>
          <button type="button" id="git-refresh" class="icon-btn" title="Refresh source control" aria-label="Refresh source control">
            <svg class="icon"><use href="#i-refresh" /></svg>
          </button>
        </div>
        <div id="git-body">
          <div id="git-branch"></div>
          <div id="git-error" hidden></div>
          <div id="git-changes"></div>
          <div id="git-save" hidden>
            <textarea id="git-message" rows="2" placeholder="Commit message  (⌘⏎ to commit)" spellcheck="true"></textarea>
            <button type="button" id="git-save-btn" class="settings-btn">Commit</button>
          </div>
          <div id="git-notice" hidden></div>
          <div id="git-commits"></div>
        </div>
      </section>
      <section id="reviews" class="section">
        <div class="v-resizer" data-resize="reviews" title="Drag to resize, double-click to reset"></div>
        <div id="reviews-header" class="section-header">
          <button type="button" id="reviews-toggle" class="icon-btn section-toggle" title="Collapse review requests" aria-label="Collapse review requests">
            <svg class="icon"><use href="#i-chevron-down" /></svg>
          </button>
          <span id="reviews-title" class="section-title">Review requests</span>
          <button type="button" id="reviews-refresh" class="icon-btn" title="Refresh review requests" aria-label="Refresh review requests">
            <svg class="icon"><use href="#i-refresh" /></svg>
          </button>
        </div>
        <div id="reviews-tools">
          <input id="reviews-search" type="search" placeholder="Search" aria-label="Search review requests" autocomplete="off" />
          <button type="button" class="facet" data-facet="author">Authors</button>
          <button type="button" class="facet" data-facet="repo">Repos</button>
          <button type="button" class="facet" data-facet="status">Status</button>
        </div>
        <div id="reviews-facet" hidden></div>
        <div id="reviews-error" hidden></div>
        <ul id="reviews-list"></ul>
      </section>
    </nav>
    <div id="list-resizer" title="Drag to resize"></div>
    <main id="main">
      <div id="notice" hidden></div>
      <section id="picker" hidden>
        <h2>Which workspace is this window?</h2>
        <ul id="picker-options"></ul>
        <form id="picker-new">
          <input id="picker-name" placeholder="New workspace here…" maxlength="80" autocomplete="off" />
        </form>
      </section>
      <section id="create" hidden>
        <div id="create-bar">
          <button type="button" id="create-close" title="Back to the terminal (Esc)">
            <svg class="icon"><use href="#i-arrow-left" /></svg>Back
          </button>
          <button type="button" id="create-ticket" hidden></button>
          <button type="button" id="create-github" hidden>
            <svg class="icon"><use href="#i-github" /></svg>Open in GitHub
          </button>
        </div>
        <h2 id="create-title">New workspace</h2>
        <div id="create-details" hidden></div>
        <div id="create-threads" hidden></div>
        <form id="create-form">
          <div class="field" id="create-templates">
            <span class="label">Template <span class="optional">repo, model, tabs, message and window</span></span>
            <div class="template-row">
              <select id="create-template" aria-label="Template"></select>
              <button type="button" id="template-save" class="settings-btn">Save current…</button>
              <button type="button" id="template-delete" class="settings-btn danger" hidden>Delete</button>
            </div>
            <div class="template-row" id="template-name-row" hidden>
              <input id="template-name" placeholder="Template name" maxlength="60" autocomplete="off" />
              <button type="button" id="template-confirm" class="settings-btn">Save</button>
            </div>
          </div>
          <label class="field">
            <span class="label">Name</span>
            <input id="create-name" placeholder="Name or ticket" maxlength="80" autocomplete="off" required />
          </label>
          <label class="field">
            <span class="label">Repo</span>
            <select id="create-repo"></select>
          </label>
          <label class="field">
            <span class="label">Model</span>
            <select id="create-model"></select>
          </label>
          <div class="field">
            <span class="label">Color <span class="optional">optional</span></span>
            <div id="create-color" class="create-swatches"></div>
          </div>
          <label class="field">
            <span class="label">Tabs <span class="optional">optional, one URL per line</span></span>
            <textarea id="create-tabs" rows="3" placeholder="https://" spellcheck="false" autocomplete="off"></textarea>
          </label>
          <div class="field">
            <span class="label">Start with</span>
            <div class="segmented" id="create-start">
              <button type="button" data-value="blank" class="active">Blank</button>
              <button type="button" data-value="prompt">From prompt</button>
              <button type="button" data-value="text">From text</button>
            </div>
          </div>
          <div id="create-message" hidden>
            <textarea id="create-message-text" maxlength="8000" rows="6" placeholder="The first message Claude receives" spellcheck="true"></textarea>
          </div>
          <div id="create-prompt" hidden>
            <div id="create-choose">
              <input id="create-filter" placeholder="Filter prompts" autocomplete="off" />
              <div id="create-error" hidden></div>
              <div id="create-prompts"></div>
            </div>
            <div id="create-chosen" hidden>
              <textarea id="create-text" maxlength="8000"></textarea>
              <button type="button" id="create-change">Change prompt</button>
            </div>
          </div>
          <div class="field">
            <span class="label">Window</span>
            <div class="segmented" id="create-window">
              <button type="button" data-value="new" class="active">New window</button>
              <button type="button" data-value="here">This window</button>
            </div>
          </div>
          <div id="create-actions">
            <button type="submit" id="create-submit">Create</button>
          </div>
        </form>
      </section>
      <section id="settings" hidden>
        <div id="settings-bar">
          <button type="button" id="settings-close" title="Back to the terminal (Esc)">
            <svg class="icon"><use href="#i-arrow-left" /></svg>Back
          </button>
          <span id="settings-updated"></span>
          <button type="button" id="settings-refresh" title="Refresh now" aria-label="Refresh now">
            <svg class="icon"><use href="#i-refresh" /></svg>
          </button>
        </div>
        <h2 id="settings-title">Settings</h2>
        <div id="settings-result" hidden></div>
        <div id="settings-body"><div id="settings-cards"></div></div>
      </section>
      <section id="tool" hidden>
        <div id="tool-bar">
          <button type="button" id="tool-close" title="Back to the workspace (quitting the program also goes back)">
            <svg class="icon"><use href="#i-arrow-left" /></svg>Back
          </button>
          <span id="tool-title"></span>
        </div>
        <div id="tool-terminal"></div>
      </section>
      <section id="diff" hidden>
        <div id="diff-bar">
          <button type="button" id="diff-close" title="Back to the terminal (Esc)">
            <svg class="icon"><use href="#i-arrow-left" /></svg>Back
          </button>
        </div>
        <!-- biome-ignore lint/a11y/useHeadingContent: filled in by git-view.ts when a diff opens -->
        <h2 id="diff-title"></h2>
        <div id="diff-meta"></div>
        <div id="diff-layout">
          <div id="diff-files" hidden></div>
          <div id="diff-body"></div>
        </div>
      </section>
      <div id="terminal"></div>
      <div id="palette" hidden>
        <div id="palette-box" role="dialog" aria-label="Command palette">
          <input id="palette-input" placeholder="Jump to a workspace or review, or run a command…" autocomplete="off" spellcheck="false" />
          <!-- biome-ignore lint/a11y/noNoninteractiveElementToInteractiveRole: the palette is an ARIA listbox -->
          <ul id="palette-results" role="listbox"></ul>
          <div id="palette-foot">↑↓ to move · Enter to choose · Esc to close</div>
        </div>
      </div>
    </main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
