version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # engines says Node >=22.18, so newer typings would allow APIs that Node 22 lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
