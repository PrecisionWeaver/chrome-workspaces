name: release

# Publishes a GitHub release whenever main carries a version that has no tag yet.
# Bump the version with `npm run release -- <patch|minor|major>`; see docs/releasing.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install
        if: steps.version.outputs.exists != 'true'
        run: npm ci
      - name: Check
        if: steps.version.outputs.exists != 'true'
        run: |
          npm run format:check
          npm run typecheck
          npm test
          npm run build:extension
      - name: Package the extension
        if: steps.version.outputs.exists != 'true'
        run: (cd extension/dist && zip -qr "../../chrome-workspaces-extension-${{ steps.version.outputs.tag }}.zip" .)
      - name: Publish
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" "chrome-workspaces-extension-${{ steps.version.outputs.tag }}.zip" --target "$GITHUB_SHA" --generate-notes --title "${{ steps.version.outputs.tag }}"
