name: release

# Tags main with vX.Y.Z whenever it carries a version that has no tag yet. The in-app updater follows these tags; no GitHub Release is created.
# Bump the version with `npm run release -- <patch|minor|major>`; see docs/releasing.md.
# It runs on Linux like ci.yml: nothing here needs macOS, and GitHub's macOS runners queue for many minutes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install
        if: steps.version.outputs.exists != 'true'
        run: npm ci
      - name: Check
        if: steps.version.outputs.exists != 'true'
        run: |
          npm run check
          npm run typecheck
          npm run test:coverage
          npm run build:extension
      - name: Tag
        if: steps.version.outputs.exists != 'true'
        run: |
          git tag "${{ steps.version.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.version.outputs.tag }}"
