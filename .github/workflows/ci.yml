name: ci

# Typecheck, test and build everything that is not main; main is checked by release.yml.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm run typecheck
          npm test
          npm run build:extension
