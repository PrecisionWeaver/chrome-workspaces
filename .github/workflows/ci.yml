name: ci

# Typecheck, test and build every pull request and every push, main included: release.yml checks main only when it cuts a release.
on:
  pull_request:
  push:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npm run check
          npm run typecheck
          npm run test:coverage
          npm run build:extension
